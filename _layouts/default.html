<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23b0325c'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Didot,Georgia,serif' font-style='italic' font-size='22' fill='%23fbf8f9'%3EQ%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <div class="wrap">
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/research/' | relative_url }}"{% if page.url == '/research/' %} aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/dance/' | relative_url }}"{% if page.url == '/dance/' %} aria-current="page"{% endif %}>Dance</a>
        <a href="{{ '/writing/' | relative_url }}"{% if page.url contains '/writing/' %} aria-current="page"{% endif %}>Writing</a>
      </nav>
    </header>

    <main>
{{ content }}
    </main>

    <footer class="site-footer mono">
      <span>&copy; {{ site.time | date: '%Y' }} {{ site.title }}</span>
      <ul>
        <li><a href="mailto:{{ site.email }}">{{ site.email }}</a></li>
        <li><a href="https://github.com/{{ site.github_username }}">GitHub</a></li>
        <li><a href="{{ '/feed.xml' | relative_url }}">RSS</a></li>
      </ul>
    </footer>
  </div>
</body>
</html>
