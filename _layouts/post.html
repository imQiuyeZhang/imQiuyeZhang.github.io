---
layout: default
---
<article class="post" lang="{{ page.lang | default: site.lang }}">
  <div class="post-rail mono">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time>
    {% if page.tags.size > 0 %}<br>{{ page.tags | join: ', ' }}{% endif %}
  </div>
  <div>
    <h1>{{ page.title }}</h1>
    <div class="prose">
{{ content }}
    </div>

    <nav class="post-nav" aria-label="More writing">
      {% if page.previous %}
      <a href="{{ page.previous.url | relative_url }}"><span class="label">Earlier</span>{{ page.previous.title }}</a>
      {% else %}<span></span>{% endif %}
      {% if page.next %}
      <a href="{{ page.next.url | relative_url }}"><span class="label">Later</span>{{ page.next.title }}</a>
      {% endif %}
    </nav>
  </div>
</article>
