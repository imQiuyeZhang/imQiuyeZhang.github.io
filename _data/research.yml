projects:
  - title: Differences in reinforcement learning in dynamic environments in depression
    when: Sep 2024 – Apr 2025
    meta: "BSc Honours thesis, University of Edinburgh. Supervisor: Prof. Peggy Seriès"
    text: >-
      Used probabilistic learning tasks to study deficits in adapting to
      volatility in depression, analysing behavioural data with
      reinforcement-learning models and Hierarchical Gaussian Filters.
  - title: A decision-theoretic model of binocular rivalry
    when: Aug 2024 – Apr 2025
    meta: "Research project, TU Dresden. Supervisor: Dr. Shervin Safavi"
    text: >-
      Co-developed a three-state perceptual partially observable Markov
      decision process (POMDP) model of binocular rivalry, aiming to reproduce
      empirical findings and clarify perceptual decision-making under
      uncertainty.
  - title: Using brain modularity to predict risk of cardiovascular disease
    when: Oct 2023 – May 2024
    meta: "Research project, Carnegie Mellon University. Supervisor: Prof. Timothy Verstynen"
    text: >-
      Analysed beta coefficients from fMRI data to assess brain modularity
      linked to cardiovascular risk, and ran statistical analyses to identify
      neurophysiological predictors of blood pressure reactivity.

presentations:
  - title: A reinforcement learning model of task-modulated perception
    when: Jun 2025
    meta: Poster, Multi-disciplinary Conference on Reinforcement Learning and Decision Making (RLDM)
    text: The perceptual POMDP model of binocular rivalry developed at TU Dresden.
  - title: "Brain plasticity and neural networks: applications in computational psychiatry"
    when: Apr 2023
    meta: Poster, BCS Women Lovelace Colloquium. Best Poster Award
    text: >-
      On applying human brain learning mechanisms to artificial neural
      networks, and the potential implications for computational psychiatry.

